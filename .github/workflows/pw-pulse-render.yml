name: PW MedEd Pulse Render

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Install Remotion
        working-directory: remotion
        run: npm install --no-audit --no-fund

      - name: Ensure Chrome headless shell
        working-directory: remotion
        run: npx remotion browser ensure

      - name: Render Pulse 720p
        working-directory: remotion
        run: |
          mkdir -p out
          npx remotion render src/index.ts PwMedEdPulse out/pw-meded-pulse-720p.mp4 \
            --codec=h264 --crf=18 --concurrency=2

      - name: Inspect
        working-directory: remotion
        run: |
          ls -lh out
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate \
            -show_entries format=duration,size -of json out/pw-meded-pulse-720p.mp4

      - name: Publish public link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="pw-pulse-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" remotion/out/pw-meded-pulse-720p.mp4 \
            --title "PW MedEd Pulse $TAG" \
            --notes "PW MedEd October offer — dark kinetic 720p" \
            --latest=false
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/pw-meded-pulse-720p.mp4"
          echo "### [Download PW MedEd Pulse 720p](${URL})" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pw-meded-pulse-720p
          path: remotion/out/pw-meded-pulse-720p.mp4
          retention-days: 7
