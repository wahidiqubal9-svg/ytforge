name: PW MedEd Offer Render

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
      - name: Install Remotion
        working-directory: remotion
        run: npm install --no-audit --no-fund
      - name: Ensure Chrome headless shell
        working-directory: remotion
        run: npx remotion browser ensure
      - name: Render PW MedEd 360p
        working-directory: remotion
        run: |
          mkdir -p out
          npx remotion render src/index.ts PwMedEdOffer out/pw-meded-offer-360p.mp4 \
            --codec=h264 --crf=22 --concurrency=2
      - name: Inspect
        working-directory: remotion
        run: |
          ls -lh out
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate \
            -show_entries format=duration,size -of json out/pw-meded-offer-360p.mp4
      - name: Publish public link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="pw-offer-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" remotion/out/pw-meded-offer-360p.mp4 \
            --title "PW MedEd Offer $TAG" \
            --notes "PW MedEd October offer — 360p test" \
            --latest=false
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/pw-meded-offer-360p.mp4"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pw-meded-offer-360p
          path: remotion/out/pw-meded-offer-360p.mp4
          retention-days: 7
