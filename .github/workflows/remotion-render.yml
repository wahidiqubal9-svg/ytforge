name: Remotion Render

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: remotion/package-lock.json

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Install Remotion
        working-directory: remotion
        run: npm install --no-audit --no-fund

      - name: Ensure Chrome headless shell
        working-directory: remotion
        run: npx remotion browser ensure

      - name: Render
        working-directory: remotion
        run: |
          mkdir -p out
          npx remotion render src/index.ts Promo out/video.mp4 \
            --props=props.json \
            --codec=h264 \
            --crf=18 \
            --concurrency=2

      - name: Inspect
        working-directory: remotion
        run: |
          ls -lh out
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate \
            -show_entries format=duration,size -of json out/video.mp4

      - name: Publish public link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="remotion-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" remotion/out/video.mp4 \
            --title "Remotion render $TAG" \
            --notes "Remotion 720p test render" \
            --latest=false
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/video.mp4"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotion-video
          path: remotion/out/video.mp4
          retention-days: 7
