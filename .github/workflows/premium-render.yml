name: Premium Render

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Install Remotion
        working-directory: remotion
        run: npm install --no-audit --no-fund

      - name: Ensure Chrome headless shell
        working-directory: remotion
        run: npx remotion browser ensure

      - name: Render premium 360p
        working-directory: remotion
        run: |
          mkdir -p out
          npx remotion render src/index.ts PremiumPromo out/video-360p.mp4 \
            --props=premium-props.json \
            --codec=h264 \
            --crf=22 \
            --concurrency=2

      - name: Inspect
        working-directory: remotion
        run: |
          ls -lh out
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate \
            -show_entries format=duration,size -of json out/video-360p.mp4

      - name: Publish public link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="premium-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" remotion/out/video-360p.mp4 \
            --title "Premium render $TAG" \
            --notes "Premium Remotion 360p test render with Sarvam audio" \
            --latest=false
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/video-360p.mp4"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: premium-video-360p
          path: remotion/out/video-360p.mp4
          retention-days: 7
