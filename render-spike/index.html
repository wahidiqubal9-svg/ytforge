<!doctype html>
<html lang="en" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=720, height=1280" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  :root{--bg:#07111f;--ink:#f7fbff;--accent:#3ee6b0;--muted:#8aa0b8}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:720px;height:1280px;overflow:hidden;background:var(--bg);font-family:system-ui,sans-serif}
  #root{position:relative;width:720px;height:1280px;overflow:hidden;
    background:radial-gradient(1000px 800px at 80% 10%, #14395c 0%, #07111f 60%, #030812 100%)}
  .clip{position:absolute;inset:0;visibility:hidden;display:flex;align-items:center;justify-content:center;padding:72px}
  .kicker{color:var(--accent);font-size:22px;letter-spacing:.22em;text-transform:uppercase;font-weight:700}
  h1{color:var(--ink);font-size:86px;line-height:.98;letter-spacing:-.04em;font-weight:800}
  h1 span{color:var(--accent)}
  p{color:var(--muted);font-size:30px;line-height:1.35;margin-top:26px;max-width:560px}
  .center{text-align:center;display:flex;flex-direction:column;align-items:center}
  .row{display:flex;gap:18px;margin-top:36px;width:100%;max-width:560px}
  .card{flex:1;background:#0d1d30;border:1px solid #1f3a55;border-radius:22px;padding:24px;color:var(--ink)}
  .card b{display:block;font-size:46px;color:var(--accent)}
  .card span{font-size:20px;color:var(--muted)}
  .bar{width:560px;height:10px;border-radius:99px;background:#122c44;margin-top:36px;overflow:hidden}
  .bar i{display:block;width:0;height:100%;background:var(--accent)}
  .grain{position:absolute;inset:0;opacity:.06;background-image:radial-gradient(#fff 1px, transparent 1px);background-size:4px 4px;pointer-events:none}
  .tag{position:absolute;bottom:54px;left:0;right:0;text-align:center;color:#4d6781;font-size:18px;letter-spacing:.12em}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="720" data-height="1280">
  <div id="s1" class="clip" data-start="0" data-duration="3.2" data-track-index="0">
    <div class="center">
      <div id="k1" class="kicker">YTForge</div>
      <h1 id="t1">Make <span>videos</span><br/>by chatting.</h1>
      <p id="p1">Script, voice, render and publish — from one place.</p>
    </div>
  </div>
  <div id="s2" class="clip" data-start="3.2" data-duration="3.6" data-track-index="1">
    <div class="center">
      <h1 id="t2" style="font-size:64px">One idea.<br/><span>Three steps.</span></h1>
      <div class="row" id="cards">
        <div class="card"><b>01</b><span>Plan</span></div>
        <div class="card"><b>02</b><span>Build</span></div>
        <div class="card"><b>03</b><span>Post</span></div>
      </div>
      <div class="bar"><i id="bar"></i></div>
    </div>
  </div>
  <div id="s3" class="clip" data-start="6.8" data-duration="3.2" data-track-index="2">
    <div class="center">
      <h1 id="t3" style="font-size:78px">Ready to<br/><span>publish.</span></h1>
      <p id="p3">720p · Sarvam voice · YouTube</p>
    </div>
  </div>
  <div class="tag">YT FORGE · LOCAL PREVIEW</div>
  <div class="grain"></div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#k1", {opacity:0,y:24}, {opacity:1,y:0,duration:.5,ease:"power3.out"}, 0.1);
  tl.fromTo("#t1", {opacity:0,y:44}, {opacity:1,y:0,duration:.7,ease:"power4.out"}, 0.25);
  tl.fromTo("#p1", {opacity:0,y:20}, {opacity:1,y:0,duration:.6,ease:"power3.out"}, 0.6);
  tl.fromTo("#t2", {opacity:0,scale:.94}, {opacity:1,scale:1,duration:.6,ease:"power3.out"}, 3.35);
  tl.fromTo("#cards .card", {opacity:0,y:28},{opacity:1,y:0,duration:.5,stagger:.12,ease:"power3.out"},3.6);
  tl.fromTo("#bar i",{width:"0%"},{width:"100%",duration:2.2,ease:"power2.inOut"},4.0);
  tl.fromTo("#t3",{opacity:0,y:38},{opacity:1,y:0,duration:.65,ease:"power4.out"},7.0);
  tl.fromTo("#p3",{opacity:0},{opacity:1,duration:.5},7.45);
  window.__timelines = window.__timelines || {};
  window.__timelines.main = tl;
  tl.seek(0);
</script>
</body>
</html>
